name: Release

# Cutting a release:
#   1. Bump "version" in package.json to X.Y.Z
#   2. Move the CHANGELOG.md [Unreleased] entries under a new [X.Y.Z] - YYYY-MM-DD heading
#   3. Commit, then: git tag vX.Y.Z && git push origin vX.Y.Z
# This workflow builds signed and notarized macOS DMG/ZIP artifacts for Apple
# Silicon and Intel, then attaches them to a GitHub Release named after the
# tag, with notes pulled from CHANGELOG.md.
#
# Required repository or environment secrets:
#   MAC_CSC_LINK          Base64-encoded Developer ID Application .p12
#   MAC_CSC_KEY_PASSWORD  Password used when exporting the .p12
#   APPLE_API_KEY_P8      Base64-encoded App Store Connect API .p8
#   APPLE_API_KEY_ID      App Store Connect API key ID
#   APPLE_API_ISSUER      App Store Connect API issuer ID

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check signing secrets
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_P8 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi

      # electron-builder expects APPLE_API_KEY to be a path to the .p8 file,
      # so reconstruct it only in the ephemeral runner filesystem.
      - name: Prepare Apple notarization key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" \
            | base64 --decode \
            > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Extract changelog section for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "--- release notes ---"
          cat release_notes.md

      - name: Build, sign, notarize, and publish arm64/x64 DMG/ZIP
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signed and notarized applications
        shell: bash
        run: |
          found=0
          while IFS= read -r -d '' app; do
            found=1
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done < <(find dist -type d -name 'Noteato.app' -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "::error::No packaged Noteato.app bundles found"
            exit 1
          fi

      - name: Attach changelog to release notes
        run: gh release edit "${{ github.ref_name }}" --notes-file release_notes.md --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
