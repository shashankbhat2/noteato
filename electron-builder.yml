appId: com.noteato.app
productName: Noteato
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.md'
  - '!**/test/**'
  - '!**/*.d.ts'
asar: true
afterPack: scripts/afterPack.cjs
# NoteatoAgent lands at Noteato.app/Contents/Resources/NoteatoAgent. It is a
# helper inside the one bundle rather than a second app: one signature, one
# updater, and the existing release pipeline is untouched. Residency comes from
# registering it as a login item, not from being the bundle's main executable.
extraResources:
  - from: resources/NoteatoAgent
    to: NoteatoAgent
electronLanguages:
  - en
artifactName: '${productName}-${version}-${arch}.${ext}'
# Register with the OS as an editor for markdown files (enables Finder
# "Open With" / double-click via Launch Services on macOS).
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown document
    role: Editor
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Publish native builds for both Apple Silicon and Intel Macs.
  target:
    - dmg
    - zip
  # No Apple Developer account: publish unsigned builds for now.
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Noteato uses your microphone for dictation.
npmRebuild: false
publish:
  provider: github
