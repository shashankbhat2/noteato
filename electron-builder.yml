appId: com.noteato.app
productName: Noteato
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.md'
  - '!**/test/**'
  - '!**/*.d.ts'
asar: true
afterPack: scripts/afterPack.cjs
# Compiled by scripts/build-native.mjs. Bare executables rather than a nested
# helper app, so microphone and Screen Recording permissions attach to Noteato
# itself — one identity, one prompt each.
extraResources:
  - from: resources/bin
    to: bin
electronLanguages:
  - en
artifactName: '${productName}-${version}-${arch}.${ext}'
# Register with the OS as an editor for markdown files (enables Finder
# "Open With" / double-click via Launch Services on macOS).
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown document
    role: Editor
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Publish native builds for both Apple Silicon and Intel Macs.
  target:
    - dmg
    - zip
  # No Apple Developer account: publish unsigned builds for now.
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Noteato records your microphone for meeting notes.
    NSScreenCaptureUsageDescription:
      Noteato captures system audio so everyone in a meeting can be transcribed.
    NSAudioCaptureUsageDescription:
      Noteato records your Mac's audio so the other side of a meeting is captured too.
npmRebuild: false
publish:
  provider: github
