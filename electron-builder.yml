appId: com.noteato.app
productName: Noteato
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.md'
  - '!**/test/**'
  - '!**/*.d.ts'
asar: true
afterPack: scripts/afterPack.cjs
electronLanguages:
  - en
artifactName: '${productName}-${version}-${arch}.${ext}'
# Never allow a release build to silently fall back to an unsigned app.
forceCodeSigning: true
# Register with the OS as an editor for markdown files (enables Finder
# "Open With" / double-click via Launch Services on macOS).
fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown document
    role: Editor
  - ext: markdown
    name: Markdown
    description: Markdown document
    role: Editor
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # Publish native builds for both Apple Silicon and Intel Macs.
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Noteato uses your microphone for dictation.
npmRebuild: false
publish:
  provider: github
